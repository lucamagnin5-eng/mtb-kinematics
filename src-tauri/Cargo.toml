[package]
name = "mtb-kinematics"
version = "0.2.0"
description = "Logiciel de géométrie et de cinématique de suspension VTT"
edition = "2021"

[lib]
name = "mtb_kinematics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
